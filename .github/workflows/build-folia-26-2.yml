name: Build ExcellentCrates Folia 26.2 (experimental)
on:
  push:
    branches: [folia-26.2]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build and run tests
        run: gradle --no-daemon clean build --stacktrace
      - name: Check shaded artifact metadata
        shell: bash
        run: |
          set -euo pipefail
          jar_file="crates-plugin/build/libs/ExcellentCrates-7.1.0-folia.26.2.1.jar"
          test -s "$jar_file"
          unzip -p "$jar_file" plugin.yml | grep -q 'folia-supported: true'
          unzip -p "$jar_file" plugin.yml | grep -q '7.1.0-folia.26.2.1'
          echo "SHA256:" && sha256sum "$jar_file"
      - name: Upload experimental JAR
        uses: actions/upload-artifact@v4
        with:
          name: ExcellentCrates-7.1.0-folia.26.2.1
          path: crates-plugin/build/libs/ExcellentCrates-7.1.0-folia.26.2.1.jar
          if-no-files-found: error
          retention-days: 30
